name: Pruebas y publicación

# Cómo funciona, en sencillo:
# - En cada subida de código a la rama principal, corre las pruebas.
# - Si la versión indicada en pubspec.yaml todavía NO tiene una
#   publicación (Release) en GitHub, compila Android y Windows y crea
#   la publicación con los dos archivos. Si ya existe, no la duplica.
# Es el mismo lugar (Releases) que la app revisará en la Fase 10
# para actualizarse sola.
# - Android se firma SIEMPRE con la misma llave permanente (v0.6.2):
#   la llave llega como secreto del repositorio, nunca como archivo
#   del código. Así el celular acepta las actualizaciones.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    name: Revisión y pruebas automáticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Instalar dependencias
        run: flutter pub get
      - name: Generar código de la base de datos
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Revisar el código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Correr las pruebas
        run: flutter test

  version:
    name: Revisar si la versión ya está publicada
    needs: pruebas
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.datos.outputs.version }}
      falta_publicar: ${{ steps.datos.outputs.falta_publicar }}
    steps:
      - uses: actions/checkout@v4
      - id: datos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "falta_publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "falta_publicar=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Compilar Android (APK)
    needs: version
    if: needs.version.outputs.falta_publicar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Regenerar la plataforma Android (archivos binarios que no viajan por el repo)
        run: flutter create . --project-name finanzas_hogar --org com.finanzashogar --platforms=android,windows
      - name: Dar permiso de ejecución al lanzador de Gradle
        run: chmod +x android/gradlew
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Poner la llave de firma permanente de la app
        env:
          LLAVE_ANDROID_BASE64: ${{ secrets.LLAVE_ANDROID_BASE64 }}
          LLAVE_ANDROID_CLAVE: ${{ secrets.LLAVE_ANDROID_CLAVE }}
          LLAVE_ANDROID_ALIAS: ${{ secrets.LLAVE_ANDROID_ALIAS }}
        run: |
          echo "$LLAVE_ANDROID_BASE64" | base64 --decode > android/llave-original.bin
          if keytool -importkeystore -noprompt -srckeystore android/llave-original.bin -srcstoretype JKS -srcstorepass "$LLAVE_ANDROID_CLAVE" -destkeystore android/finanzas-release.jks -deststoretype JKS -deststorepass "$LLAVE_ANDROID_CLAVE" -destkeypass "$LLAVE_ANDROID_CLAVE"; then
            echo "Llave pasada al formato clasico (JKS)."
          else
            rm -f android/finanzas-release.jks
            keytool -importkeystore -noprompt -srckeystore android/llave-original.bin -srcstoretype PKCS12 -srcstorepass "$LLAVE_ANDROID_CLAVE" -destkeystore android/finanzas-release.jks -deststoretype JKS -deststorepass "$LLAVE_ANDROID_CLAVE" -destkeypass "$LLAVE_ANDROID_CLAVE"
            echo "Llave pasada al formato clasico (JKS) desde el formato moderno."
          fi
          rm -f android/llave-original.bin
          echo "Huella de la llave que firmara el APK:"
          keytool -list -v -keystore android/finanzas-release.jks -storepass "$LLAVE_ANDROID_CLAVE" | grep "SHA256:" || true
          keytool -list -keystore android/finanzas-release.jks -storepass "$LLAVE_ANDROID_CLAVE"
          {
            echo "storePassword=$LLAVE_ANDROID_CLAVE"
            echo "keyPassword=$LLAVE_ANDROID_CLAVE"
            echo "keyAlias=finanzas"
            echo "storeFile=finanzas-release.jks"
          } > android/key.properties
      - name: Compilar el APK
        run: flutter build apk --release
      - name: Guardar el APK para la publicación
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Compilar Windows (PC)
    needs: version
    if: needs.version.outputs.falta_publicar == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Regenerar la plataforma Windows (archivos binarios que no viajan por el repo)
        run: flutter create . --project-name finanzas_hogar --org com.finanzashogar --platforms=android,windows
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Compilar el programa de Windows
        run: flutter build windows --release
      - name: Empaquetar en un ZIP
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Finanzas-del-Hogar-Windows-v$version.zip"
      - name: Guardar el ZIP para la publicación
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Finanzas-del-Hogar-Windows-v${{ needs.version.outputs.version }}.zip

  publicar:
    name: Crear la publicación en Releases
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar el APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: archivos
      - name: Descargar el paquete de Windows
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: archivos
      - name: Crear la publicación
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mv "archivos/app-release.apk" "archivos/Finanzas-del-Hogar-Android-v$VERSION.apk"
          gh release create "v$VERSION" \
            --title "Finanzas del Hogar v$VERSION" \
            --notes "Versión v$VERSION de Finanzas del Hogar. Android: instala el archivo APK. Windows: descarga el ZIP, descomprímelo y abre el programa. El detalle de cambios está en el archivo CHANGELOG.md del repositorio." \
            "archivos/Finanzas-del-Hogar-Android-v$VERSION.apk" \
            "archivos/Finanzas-del-Hogar-Windows-v$VERSION.zip"
